<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two Ways to Count Reservation | Abin Thomas</title>
  <meta name="description" content="One merit queue, the same 100 vacancies, and two different reservation allocation rules.">
  <meta name="author" content="Abin Thomas">
  <meta name="robots" content="noindex, nofollow">
  <meta id="themeColor" name="theme-color" content="#faf9f5">
  <link rel="canonical" href="https://abinthomas.in/blog/reservation-allocation/animation/">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">

  <meta property="og:type" content="article">
  <meta property="og:site_name" content="Abin Thomas">
  <meta property="og:title" content="Same vacancies. Same merit queue. Different counting rule.">
  <meta property="og:description" content="A visual comparison of over-and-above and horizontal allocation.">
  <meta property="og:url" content="https://abinthomas.in/blog/reservation-allocation/animation/">
  <meta property="og:locale" content="en_IN">

  <script>
    (function () {
      var requestedTheme = new URLSearchParams(window.location.search).get("theme");
      var initialTheme = requestedTheme === "dark" || requestedTheme === "light"
        ? requestedTheme
        : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.dataset.theme = initialTheme;
    }());
  </script>

  <style>
    :root {
      color-scheme: light;
      --paper: #faf9f5;
      --ink: #202328;
      --muted: #70757d;
      --faint: #d9d8d2;
      --axis: #bfc1bd;
      --branch: #c9c9c3;
      --divider: #e3e2dc;
      --open: #0072b2;
      --open-label: #0072b2;
      --general: #4d535c;
      --obc: #e69f00;
      --obc-label: #a56f00;
      --scst: #bd4f91;
      --scst-label: #9e3978;
      --reject: #b34a40;
      --score-on-dark: #ffffff;
      --score-on-obc: #352600;
      --control-bg: rgba(250, 249, 245, 0.94);
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --paper: #191a1d;
      --ink: #e9e7df;
      --muted: #aaaeb5;
      --faint: #464950;
      --axis: #646870;
      --branch: #555961;
      --divider: #3c3f45;
      --open: #66b3ff;
      --open-label: #82c2ff;
      --general: #aeb4bd;
      --obc: #ffc04a;
      --obc-label: #ffd271;
      --scst: #ee8bc9;
      --scst-label: #f09ed2;
      --reject: #ff8a80;
      --score-on-dark: #16181c;
      --score-on-obc: #352600;
      --control-bg: rgba(25, 26, 29, 0.94);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-width: 0;
      min-height: 100%;
      margin: 0;
      background: var(--paper);
    }

    body {
      overflow-x: hidden;
      color: var(--ink);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
    }

    main {
      display: grid;
      min-height: 100svh;
      place-items: center;
    }

    body[data-view="oa"] main,
    body[data-view="mg"] main {
      padding-bottom: 34px;
    }

    .animation {
      display: block;
      width: min(100vw, 80svh, 720px);
      height: auto;
      max-height: 100svh;
      background: var(--paper);
      outline: none;
      touch-action: manipulation;
      user-select: none;
    }

    body[data-view="oa"] .animation,
    body[data-view="mg"] .animation {
      width: min(100vw, 48.6svh, 420px);
      max-height: calc(100svh - 34px);
    }

    body[data-view="compare"] .animation {
      width: min(100vw, 102.86svh, 720px);
      max-height: calc(100svh - 34px);
    }

    body[data-compact="true"] main {
      min-height: 100svh;
    }

    body[data-compact="true"] .animation {
      max-width: 100vw;
    }

    body[data-compact="true"][data-view="oa"] .animation,
    body[data-compact="true"][data-view="mg"] .animation {
      width: min(100vw, 72.03svh, 340px);
    }

    body[data-compact="true"][data-view="oa"] .side-title,
    body[data-compact="true"][data-view="mg"] .side-title {
      font-size: 17px;
    }

    body[data-compact="true"][data-view="oa"] .candidate-score,
    body[data-compact="true"][data-view="mg"] .candidate-score {
      font-size: 6.8px;
    }

    body[data-compact="true"][data-view="compare"] .eyebrow {
      font-size: 10px;
    }

    body[data-compact="true"][data-view="compare"] .side-title {
      font-size: 17px;
    }

    body[data-compact="true"][data-view="compare"] .cutoff-table-heading {
      font-size: 9px;
    }

    body[data-compact="true"][data-view="compare"] .cutoff-table-value {
      font-size: 15px;
    }

    body[data-compact="true"][data-view="oa"] .cutoff-caption,
    body[data-compact="true"][data-view="mg"] .cutoff-caption,
    body[data-compact="true"][data-view="oa"] g[aria-label="Over-and-above cutoffs"],
    body[data-compact="true"][data-view="mg"] g[aria-label="Horizontal-allocation cutoffs"] {
      display: none;
    }

    body[data-controls="hidden"] main {
      padding-bottom: 0;
    }

    body[data-controls="hidden"] .animation {
      max-height: 100svh;
    }

    body[data-controls="hidden"] .embed-controls {
      display: none;
    }

    body[data-view="oa"] [data-system="proposed"],
    body[data-view="mg"] [data-system="current"] {
      display: none;
    }

    .embed-controls {
      position: fixed;
      right: 8px;
      bottom: 7px;
      z-index: 2;
      display: flex;
      gap: 6px;
    }

    .embed-control {
      min-width: 58px;
      padding: 5px 8px;
      border: 1px solid var(--faint);
      border-radius: 999px;
      background: var(--control-bg);
      color: var(--ink);
      font: 700 10px/1 inherit;
      cursor: pointer;
    }

    .embed-control:hover,
    .embed-control:focus-visible {
      border-color: var(--muted);
      outline: none;
    }

    text {
      font-family: inherit;
    }

    .eyebrow {
      fill: var(--muted);
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 1.35px;
      text-anchor: middle;
    }

    .side-title {
      fill: var(--ink);
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-anchor: middle;
    }

    .cutoff-caption {
      fill: var(--muted);
      font-size: 7px;
      font-weight: 750;
      letter-spacing: 0.8px;
      text-anchor: middle;
    }

    .cutoff-table-frame,
    .cutoff-table-rule {
      fill: none;
      stroke: var(--faint);
      stroke-width: 1;
    }

    .cutoff-table-heading {
      font-size: 7.5px;
      font-weight: 800;
      letter-spacing: 0.35px;
      text-anchor: middle;
    }

    .cutoff-table-value {
      font-size: 13px;
      font-weight: 850;
      text-anchor: middle;
    }

    .cutoff-table-heading.open,
    .cutoff-table-value.open {
      fill: var(--open-label);
    }

    .cutoff-table-heading.obc,
    .cutoff-table-value.obc {
      fill: var(--obc-label);
    }

    .cutoff-table-heading.scst,
    .cutoff-table-value.scst {
      fill: var(--scst-label);
    }

    .axis {
      fill: none;
      stroke: var(--axis);
      stroke-dasharray: 2 6;
      stroke-linecap: round;
      stroke-width: 1;
    }

    .fork {
      fill: var(--paper);
      stroke: var(--ink);
      stroke-width: 1.4;
    }

    .branch {
      fill: none;
      stroke: var(--branch);
      stroke-dasharray: 2 5;
      stroke-linecap: round;
      stroke-width: 1;
    }

    .divider {
      stroke: var(--divider);
      stroke-dasharray: 1 7;
      stroke-linecap: round;
      stroke-width: 1;
    }

    .vacancy {
      fill: none;
      stroke-dasharray: 2.3 3.2;
      stroke-linecap: round;
      stroke-width: 1.6;
      transition: opacity 160ms ease;
    }

    .vacancy.open {
      stroke: var(--open);
    }

    .vacancy.obc {
      stroke: var(--obc);
    }

    .vacancy.scst {
      stroke: var(--scst);
    }

    .vacancy.filled {
      opacity: 0.82;
    }

    .vacancy.pulse {
      animation: vacancy-pulse 620ms ease-out;
    }

    @keyframes vacancy-pulse {
      0% {
        stroke-width: 1.6;
      }
      35% {
        stroke-width: 4;
      }
      100% {
        stroke-width: 1.6;
      }
    }

    .candidate-circle {
      stroke: var(--paper);
      stroke-width: 1;
    }

    .candidate-circle.general {
      fill: var(--general);
    }

    .candidate-circle.obc {
      fill: var(--obc);
    }

    .candidate-circle.scst {
      fill: var(--scst);
    }

    .candidate-score {
      fill: var(--score-on-dark);
      font-size: 6.8px;
      font-weight: 800;
      text-anchor: middle;
    }

    .candidate-score.obc {
      fill: var(--score-on-obc);
    }

    .reject-mark {
      fill: var(--reject);
      font-size: 17px;
      font-weight: 600;
      text-anchor: middle;
    }

    .canvas-background {
      fill: var(--paper);
    }

    .screen-reader-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      .vacancy.pulse {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <svg
      id="allocationAnimation"
      class="animation"
      viewBox="0 0 720 700"
      role="img"
      tabindex="0"
      aria-labelledby="animationTitle animationDescription"
      data-phase="loading"
    >
      <title id="animationTitle">Over-and-above and horizontal allocation compared</title>
      <desc id="animationDescription">
        Each candidate in a shared merit queue is processed under both rules. Over-and-above fills Open vacancies first and category vacancies afterward. Horizontal allocation, also called minimum guarantee, fills each candidate's applicable category minimum first, then allows every category to compete for remaining Open vacancies.
        For 100 visible vacancies, 50.5% Open, 27% OBC and 22.5% SC/ST are rounded to 50, 27 and 23 seats. The illustrative queue is constructed around population shares of 28.3% General, 46.5% OBC and 25.2% SC/ST. The top 50 contain 30 General, 12 OBC and 8 SC/ST candidates. Reserved-category candidates become more common later in the queue. This is an illustration, not empirical examination data.
      </desc>

      <defs>
        <linearGradient id="queueFadeGradient" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="white" stop-opacity="0"/>
          <stop offset="0.22" stop-color="white" stop-opacity="0.4"/>
          <stop offset="0.48" stop-color="white" stop-opacity="1"/>
          <stop offset="1" stop-color="white" stop-opacity="1"/>
        </linearGradient>
        <mask id="queueFade">
          <rect x="320" y="16" width="80" height="188" fill="url(#queueFadeGradient)"/>
        </mask>
      </defs>

      <rect class="canvas-background" width="720" height="700"/>

      <text id="queueHeading" x="360" y="17" class="eyebrow">MERIT QUEUE · HIGHEST SCORE FIRST</text>
      <path class="axis" d="M360 24 V205"/>
      <path class="axis" d="M355 196 L360 205 L365 196"/>
      <g id="queueLayer" mask="url(#queueFade)"></g>

      <path class="branch" data-system="current" d="M360 214 Q320 224 292 244"/>
      <path class="branch" data-system="proposed" d="M360 214 Q400 224 428 244"/>
      <circle class="fork" cx="360" cy="212" r="4"/>

      <line class="divider" x1="360" y1="243" x2="360" y2="648"/>

      <g id="currentSystem" data-system="current" aria-label="Over-and-above allocation">
        <text x="208" y="278" class="side-title">OVER AND ABOVE</text>

        <g id="currentSlots"></g>

        <text x="208" y="585" class="cutoff-caption">CUTOFF</text>
        <g aria-label="Over-and-above cutoffs">
          <rect x="91" y="595" width="234" height="52" class="cutoff-table-frame"/>
          <path d="M91 617 H325 M169 595 V647 M247 595 V647" class="cutoff-table-rule"/>
          <text x="130" y="610" class="cutoff-table-heading open">OPEN</text>
          <text x="208" y="610" class="cutoff-table-heading obc">OBC</text>
          <text x="286" y="610" class="cutoff-table-heading scst">SC/ST</text>
          <text id="currentOpenCutoff" x="130" y="638" class="cutoff-table-value open">-</text>
          <text id="currentObcCutoff" x="208" y="638" class="cutoff-table-value obc">-</text>
          <text id="currentScstCutoff" x="286" y="638" class="cutoff-table-value scst">-</text>
        </g>
      </g>

      <g id="proposedSystem" data-system="proposed" aria-label="Horizontal allocation">
        <text x="512" y="278" class="side-title">HORIZONTAL ALLOCATION</text>

        <g id="proposedSlots"></g>

        <text x="512" y="585" class="cutoff-caption">CUTOFF</text>
        <g aria-label="Horizontal-allocation cutoffs">
          <rect x="395" y="595" width="234" height="52" class="cutoff-table-frame"/>
          <path d="M395 617 H629 M473 595 V647 M551 595 V647" class="cutoff-table-rule"/>
          <text x="434" y="610" class="cutoff-table-heading open">OPEN</text>
          <text x="512" y="610" class="cutoff-table-heading obc">OBC</text>
          <text x="590" y="610" class="cutoff-table-heading scst">SC/ST</text>
          <text id="proposedOpenCutoff" x="434" y="638" class="cutoff-table-value open">-</text>
          <text id="proposedObcCutoff" x="512" y="638" class="cutoff-table-value obc">-</text>
          <text id="proposedScstCutoff" x="590" y="638" class="cutoff-table-value scst">-</text>
        </g>
      </g>

      <g id="travellerLayer"></g>
      <g id="effectLayer"></g>
    </svg>

    <p class="screen-reader-only" id="motionHelp">
      The animation starts automatically. Press Space to pause or resume, or press R to replay.
    </p>

    <div class="embed-controls" aria-label="Animation controls">
      <button id="pauseControl" class="embed-control" type="button">Pause</button>
      <button id="replayControl" class="embed-control" type="button">Replay</button>
    </div>
  </main>

  <script>
    (function () {
      "use strict";

      var svg = document.getElementById("allocationAnimation");
      var queueLayer = document.getElementById("queueLayer");
      var travellerLayer = document.getElementById("travellerLayer");
      var effectLayer = document.getElementById("effectLayer");
      var pauseControl = document.getElementById("pauseControl");
      var replayControl = document.getElementById("replayControl");
      var themeColor = document.getElementById("themeColor");
      var params = new URLSearchParams(window.location.search);
      var requestedView = params.get("view");
      var view = requestedView === "oa" || requestedView === "mg"
        ? requestedView
        : "compare";
      var compact = params.get("compact") === "1";
      var hideControls = params.get("controls") === "0";
      var requestedTheme = params.get("theme");
      var colorSchemeQuery = window.matchMedia("(prefers-color-scheme: dark)");
      var themeSource = requestedTheme === "dark" || requestedTheme === "light"
        ? "query"
        : "system";
      var speed = Math.max(0.25, Math.min(40, Number(params.get("speed")) || 1));
      var playOnce = params.get("once") === "1";
      var forceReduced = params.get("reduced") === "1";
      var reducedMotion = forceReduced || window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var paused = false;
      var pausedByVisibility = false;
      var pauseStarted = 0;
      var totalPausedTime = 0;
      var runToken = 0;
      var firstLoop = true;

      function applyTheme(theme, source) {
        var nextTheme = theme === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = nextTheme;
        document.body.dataset.theme = nextTheme;
        themeColor.setAttribute("content", nextTheme === "dark" ? "#191a1d" : "#faf9f5");
        if (source) {
          themeSource = source;
        }
      }

      applyTheme(
        themeSource === "query"
          ? requestedTheme
          : (colorSchemeQuery.matches ? "dark" : "light")
      );

      function handleSystemThemeChange(event) {
        if (themeSource === "system") {
          applyTheme(event.matches ? "dark" : "light");
        }
      }

      if (typeof colorSchemeQuery.addEventListener === "function") {
        colorSchemeQuery.addEventListener("change", handleSystemThemeChange);
      } else if (typeof colorSchemeQuery.addListener === "function") {
        colorSchemeQuery.addListener(handleSystemThemeChange);
      }

      document.body.dataset.view = view;
      document.body.dataset.compact = compact ? "true" : "false";
      document.body.dataset.controls = hideControls ? "hidden" : "visible";
      if (compact && view !== "compare") {
        queueLayer.removeAttribute("mask");
      }
      if (view === "oa") {
        svg.setAttribute("viewBox", compact ? "40 80 340 488" : "40 0 340 700");
        svg.setAttribute("aria-label", "Over-and-above reservation allocation");
        document.getElementById("queueHeading").setAttribute("x", "210");
        document.getElementById("proposedSystem").setAttribute("aria-hidden", "true");
      } else if (view === "mg") {
        svg.setAttribute("viewBox", compact ? "340 80 340 488" : "340 0 340 700");
        svg.setAttribute("aria-label", "Horizontal allocation, also called minimum guarantee");
        document.getElementById("queueHeading").setAttribute("x", "510");
        document.getElementById("currentSystem").setAttribute("aria-hidden", "true");
      } else if (compact) {
        svg.setAttribute("viewBox", "24 0 672 660");
      }

      // The complete synthetic queue stays near the supplied population proportions.
      // Its top 50 match the article's 30 General plus 20 reserved-category example.
      // Later ranks include more OBC and SC/ST candidates. This is illustrative, not empirical.
      var queueBands = [
        { G: 30, O: 12, S: 8 },
        { G: 8, O: 23, S: 19 },
        { G: 4, O: 35, S: 11 }
      ];

      function buildRankBand(targets) {
        var counts = { G: 0, O: 0, S: 0 };
        var categories = ["G", "O", "S"];
        var result = [];
        var length = targets.G + targets.O + targets.S;

        for (var rank = 1; rank <= length; rank += 1) {
          var selected = categories[0];
          var largestDeficit = rank * targets[selected] - length * counts[selected];

          for (var index = 1; index < categories.length; index += 1) {
            var category = categories[index];
            var deficit = rank * targets[category] - length * counts[category];
            if (deficit > largestDeficit) {
              selected = category;
              largestDeficit = deficit;
            }
          }

          result.push(selected);
          counts[selected] += 1;
        }

        return result;
      }

      var categorySequence = queueBands.reduce(function (sequence, band) {
        return sequence.concat(buildRankBand(band));
      }, []);

      var candidates = categorySequence.map(function (category, index) {
        return {
          rank: index + 1,
          score: 100 - index * 0.5,
          category: category
        };
      });

      var categoryNames = {
        G: "General",
        O: "OBC",
        S: "SC/ST"
      };

      var categoryClasses = {
        G: "general",
        O: "obc",
        S: "scst"
      };

      var capacities = {
        open: 50,
        obc: 27,
        scst: 23
      };
      var totalVacancies = 100;
      var firstLoopStartRank = 1;
      var finalRank = 116;

      var poolGeometry = {
        open: { startIndex: 0 },
        obc: { startIndex: 50 },
        scst: { startIndex: 77 }
      };

      function makeState(name) {
        return {
          name: name,
          counts: { open: 0, obc: 0, scst: 0 },
          categories: { G: 0, O: 0, S: 0 },
          cutoffs: { open: null, obc: null, scst: null },
          total: 0,
          skipped: 0,
          completedAt: null,
          slots: { open: [], obc: [], scst: [] }
        };
      }

      var systems = {
        current: makeState("current"),
        proposed: makeState("proposed")
      };

      function systemProgress(state) {
        return {
          total: state.total,
          counts: {
            open: state.counts.open,
            obc: state.counts.obc,
            scst: state.counts.scst
          },
          cutoffs: {
            open: state.cutoffs.open,
            obc: state.cutoffs.obc,
            scst: state.cutoffs.scst
          },
          categories: {
            G: state.categories.G,
            O: state.categories.O,
            S: state.categories.S
          }
        };
      }

      function emitProgress() {
        window.parent.postMessage({
          type: "reservation-animation-progress",
          view: view,
          rank: Number(svg.dataset.rank) || 0,
          phase: svg.dataset.phase || "loading",
          current: systemProgress(systems.current),
          proposed: systemProgress(systems.proposed)
        }, "*");
      }

      function syncControls() {
        pauseControl.textContent = paused ? "Play" : "Pause";
        pauseControl.setAttribute("aria-label", paused ? "Resume animation" : "Pause animation");
      }

      function setPhase(phase) {
        svg.dataset.phase = phase;
        syncControls();
        emitProgress();
      }

      function svgElement(name, attributes) {
        var element = document.createElementNS("http://www.w3.org/2000/svg", name);
        Object.keys(attributes || {}).forEach(function (key) {
          element.setAttribute(key, attributes[key]);
        });
        return element;
      }

      function poolClass(pool) {
        return pool === "scst" ? "scst" : pool;
      }

      function buildSlots(systemName, startX) {
        var state = systems[systemName];
        var layer = document.getElementById(systemName + "Slots");
        var startY = 340;
        var pitch = 24;

        ["open", "obc", "scst"].forEach(function (pool) {
          var geometry = poolGeometry[pool];
          for (var index = 0; index < capacities[pool]; index += 1) {
            var gridIndex = geometry.startIndex + index;
            var column = gridIndex % 10;
            var row = Math.floor(gridIndex / 10);
            var x = startX + column * pitch;
            var y = startY + row * pitch;
            var ring = svgElement("circle", {
              cx: x,
              cy: y,
              r: 10.5,
              "class": "vacancy " + poolClass(pool),
              "data-system": systemName,
              "data-pool": pool,
              "data-index": index
            });

            layer.appendChild(ring);
            state.slots[pool].push({
              x: x,
              y: y,
              ring: ring,
              occupant: null
            });
          }
        });
      }

      buildSlots("current", 100);
      buildSlots("proposed", 404);

      function candidateGroup(candidate, radius, showScore) {
        var group = svgElement("g", {
          "aria-label": categoryNames[candidate.category] + " candidate, score " + candidate.score
        });
        var categoryClass = categoryClasses[candidate.category];
        var circle = svgElement("circle", {
          cx: 0,
          cy: 0,
          r: radius,
          "class": "candidate-circle " + categoryClass
        });
        group.appendChild(circle);
        if (showScore) {
          var label = svgElement("text", {
            x: 0,
            y: 2.7,
            "class": "candidate-score " + categoryClass
          });
          label.textContent = candidate.score;
          group.appendChild(label);
        }
        return group;
      }

      function queueOpacity(index) {
        if (index === 0) {
          return 1;
        }
        return Math.max(0.18, 1 - index * 0.125);
      }

      function renderQueue(startRank) {
        queueLayer.replaceChildren();
        var visible = 7;

        for (var index = visible - 1; index >= 0; index -= 1) {
          var candidate = candidates[startRank - 1 + index];
          if (!candidate) {
            continue;
          }
          var y = 170 - index * 28;
          var group = candidateGroup(candidate, 12.5, true);
          group.setAttribute("class", "queue-candidate");
          group.setAttribute("data-offset", index);
          group.setAttribute("transform", "translate(360 " + y + ")");
          group.setAttribute("opacity", queueOpacity(index));
          queueLayer.appendChild(group);
        }
      }

      function easeInOut(t) {
        return t < 0.5
          ? 4 * t * t * t
          : 1 - Math.pow(-2 * t + 2, 3) / 2;
      }

      function easeOut(t) {
        return 1 - Math.pow(1 - t, 3);
      }

      function effectiveNow() {
        return performance.now() - totalPausedTime - (paused ? performance.now() - pauseStarted : 0);
      }

      function waitWhilePaused() {
        if (!paused) {
          return Promise.resolve();
        }
        return new Promise(function (resolve) {
          function poll() {
            if (!paused) {
              resolve();
              return;
            }
            window.setTimeout(poll, 32);
          }
          poll();
        });
      }

      function sleep(duration, token) {
        var target = effectiveNow() + duration / speed;

        return new Promise(function (resolve) {
          function frame() {
            if (token !== runToken) {
              resolve();
              return;
            }
            if (paused) {
              window.requestAnimationFrame(frame);
              return;
            }
            if (effectiveNow() >= target) {
              resolve();
              return;
            }
            window.requestAnimationFrame(frame);
          }
          frame();
        });
      }

      function animateQueueToFork(startRank, duration, token) {
        renderQueue(startRank);
        var groups = Array.from(queueLayer.querySelectorAll(".queue-candidate"));
        var started = effectiveNow();
        var scaledDuration = duration / speed;

        return new Promise(function (resolve) {
          function frame() {
            if (token !== runToken) {
              resolve();
              return;
            }
            if (paused) {
              window.requestAnimationFrame(frame);
              return;
            }

            var progress = Math.min(1, (effectiveNow() - started) / scaledDuration);
            var eased = easeInOut(progress);

            groups.forEach(function (group) {
              var index = Number(group.getAttribute("data-offset"));
              var baseY = 170 - index * 28;
              var y = index === 0
                ? baseY + 42 * eased
                : baseY + 28 * eased;
              var scale = index === 0 ? 1 + 0.08 * eased : 1;
              var opacity = index === 0
                ? 1
                : Math.min(1, queueOpacity(index) + 0.125 * eased);
              group.setAttribute(
                "transform",
                "translate(360 " + y.toFixed(2) + ") scale(" + scale.toFixed(3) + ")"
              );
              group.setAttribute("opacity", opacity.toFixed(3));
            });

            if (progress < 1) {
              window.requestAnimationFrame(frame);
              return;
            }

            renderQueue(startRank + 1);
            resolve();
          }

          window.requestAnimationFrame(frame);
        });
      }

      function decideCurrent(state, candidate) {
        if (state.total >= totalVacancies) {
          return { kind: "complete" };
        }
        if (state.counts.open < capacities.open) {
          return { kind: "assign", pool: "open" };
        }
        if (candidate.category === "O" && state.counts.obc < capacities.obc) {
          return { kind: "assign", pool: "obc" };
        }
        if (candidate.category === "S" && state.counts.scst < capacities.scst) {
          return { kind: "assign", pool: "scst" };
        }
        return { kind: "reject" };
      }

      function decideProposed(state, candidate) {
        if (state.total >= totalVacancies) {
          return { kind: "complete" };
        }
        if (candidate.category === "O" && state.counts.obc < capacities.obc) {
          return { kind: "assign", pool: "obc" };
        }
        if (candidate.category === "S" && state.counts.scst < capacities.scst) {
          return { kind: "assign", pool: "scst" };
        }
        if (state.counts.open < capacities.open) {
          return { kind: "assign", pool: "open" };
        }
        return { kind: "reject" };
      }

      function decide(systemName, candidate) {
        return systemName === "current"
          ? decideCurrent(systems.current, candidate)
          : decideProposed(systems.proposed, candidate);
      }

      function destinationFor(systemName, action) {
        if (action.kind === "assign") {
          var state = systems[systemName];
          return state.slots[action.pool][state.counts[action.pool]];
        }
        if (action.kind === "reject") {
          return {
            x: systemName === "current" ? 54 : 666,
            y: 470
          };
        }
        return {
          x: systemName === "current" ? 208 : 512,
          y: 310
        };
      }

      function createTraveller(candidate, systemName) {
        var group = candidateGroup(candidate, 12.5, false);
        group.setAttribute("class", "traveller");
        group.setAttribute("data-system", systemName);
        group.setAttribute("transform", "translate(360 212)");
        travellerLayer.appendChild(group);
        return group;
      }

      function showReject(systemName, point) {
        var mark = svgElement("text", {
          x: point.x,
          y: point.y + 5,
          "class": "reject-mark",
          "data-system": systemName
        });
        mark.textContent = "×";
        effectLayer.appendChild(mark);

        var started = performance.now();
        var duration = 420 / speed;

        function frame(now) {
          var progress = Math.min(1, (now - started) / duration);
          mark.setAttribute("opacity", String(1 - progress));
          mark.setAttribute(
            "transform",
            "translate(0 " + (progress * 8).toFixed(2) + ")"
          );
          if (progress < 1) {
            window.requestAnimationFrame(frame);
          } else {
            mark.remove();
          }
        }

        window.requestAnimationFrame(frame);
      }

      function animateTraveller(group, systemName, action, destination, duration, token) {
        var start = { x: 360, y: 212 };
        var control = {
          x: start.x + (destination.x - start.x) * 0.68,
          y: start.y + Math.min(62, Math.max(28, (destination.y - start.y) * 0.28))
        };
        var started = effectiveNow();
        var scaledDuration = duration / speed;

        return new Promise(function (resolve) {
          function frame() {
            if (token !== runToken) {
              group.remove();
              resolve();
              return;
            }
            if (paused) {
              window.requestAnimationFrame(frame);
              return;
            }

            var progress = Math.min(1, (effectiveNow() - started) / scaledDuration);
            var eased = easeInOut(progress);
            var inverse = 1 - eased;
            var x = inverse * inverse * start.x
              + 2 * inverse * eased * control.x
              + eased * eased * destination.x;
            var y = inverse * inverse * start.y
              + 2 * inverse * eased * control.y
              + eased * eased * destination.y;
            var scale = action.kind === "assign"
              ? 1 - eased * 0.24
              : 1 - eased * 0.35;
            var opacity = action.kind === "assign"
              ? 1
              : Math.max(0, 1 - Math.max(0, eased - 0.58) / 0.42);

            group.setAttribute(
              "transform",
              "translate(" + x.toFixed(2) + " " + y.toFixed(2) + ") scale(" + scale.toFixed(3) + ")"
            );
            group.setAttribute("opacity", opacity.toFixed(3));

            if (progress < 1) {
              window.requestAnimationFrame(frame);
              return;
            }

            group.remove();
            if (action.kind === "reject") {
              showReject(systemName, destination);
            }
            resolve();
          }

          window.requestAnimationFrame(frame);
        });
      }

      function fillSlot(systemName, pool, candidate) {
        var state = systems[systemName];
        var slot = state.slots[pool][state.counts[pool]];
        var occupant = candidateGroup(candidate, 8.2, false);
        occupant.setAttribute("class", "occupant");
        occupant.setAttribute("transform", "translate(" + slot.x + " " + slot.y + ")");
        occupant.setAttribute("data-category", candidate.category);
        occupant.setAttribute("data-score", candidate.score);
        occupant.setAttribute("data-pool", pool);

        document.getElementById(systemName + "Slots").appendChild(occupant);
        slot.occupant = occupant;
        slot.ring.classList.add("filled");
        slot.ring.classList.remove("pulse");
        void slot.ring.getBoundingClientRect();
        slot.ring.classList.add("pulse");

        state.counts[pool] += 1;
        state.categories[candidate.category] += 1;
        state.cutoffs[pool] = candidate.score;
        state.total += 1;
        if (state.total === totalVacancies) {
          state.completedAt = candidate.rank;
        }

        updateSystemLabels(systemName);
      }

      function markRejected(systemName) {
        systems[systemName].skipped += 1;
        updateSystemLabels(systemName);
      }

      function updateSystemLabels(systemName) {
        var state = systems[systemName];

        ["open", "obc", "scst"].forEach(function (pool) {
          var idPart = pool === "open"
            ? "Open"
            : pool === "obc"
              ? "Obc"
              : "Scst";
          var element = document.getElementById(systemName + idPart + "Cutoff");
          element.textContent = state.cutoffs[pool] === null ? "-" : state.cutoffs[pool];
        });
      }

      var fixedTiming = { approach: 140, travel: 320, gap: 60 };

      async function allocateCopy(systemName, candidate, action, duration, token) {
        if (action.kind === "complete") {
          return;
        }

        var destination = destinationFor(systemName, action);
        var traveller = createTraveller(candidate, systemName);
        await animateTraveller(traveller, systemName, action, destination, duration, token);

        if (token !== runToken) {
          return;
        }
        if (action.kind === "assign") {
          fillSlot(systemName, action.pool, candidate);
        } else if (action.kind === "reject") {
          markRejected(systemName);
        }
      }

      function allocateCandidateInstantly(candidate) {
        ["current", "proposed"].forEach(function (systemName) {
          var action = decide(systemName, candidate);
          if (action.kind === "assign") {
            fillSlot(systemName, action.pool, candidate);
          } else if (action.kind === "reject") {
            markRejected(systemName);
          }
        });
      }

      function visibleSystemsAreComplete() {
        if (view === "oa") {
          return systems.current.total >= totalVacancies;
        }
        if (view === "mg") {
          return systems.proposed.total >= totalVacancies;
        }
        return systems.current.total >= totalVacancies
          && systems.proposed.total >= totalVacancies;
      }

      function resetSystems(loopStartRank) {
        svg.dataset.phase = "reset";
        syncControls();

        ["current", "proposed"].forEach(function (systemName) {
          var oldState = systems[systemName];

          Object.keys(oldState.slots).forEach(function (pool) {
            oldState.slots[pool].forEach(function (slot) {
              if (slot.occupant) {
                slot.occupant.remove();
                slot.occupant = null;
              }
              slot.ring.classList.remove("filled", "pulse");
            });
          });

          oldState.counts = { open: 0, obc: 0, scst: 0 };
          oldState.categories = { G: 0, O: 0, S: 0 };
          oldState.cutoffs = { open: null, obc: null, scst: null };
          oldState.total = 0;
          oldState.skipped = 0;
          oldState.completedAt = null;
          updateSystemLabels(systemName);
        });

        travellerLayer.replaceChildren();
        effectLayer.replaceChildren();

        for (var index = 0; index < loopStartRank - 1; index += 1) {
          allocateCandidateInstantly(candidates[index]);
        }

        ["current", "proposed"].forEach(function (systemName) {
          ["open", "obc", "scst"].forEach(function (pool) {
            systems[systemName].slots[pool].forEach(function (slot) {
              slot.ring.classList.remove("pulse");
            });
          });
        });

        svg.dataset.rank = String(loopStartRank - 1);
        renderQueue(loopStartRank);
        emitProgress();
      }

      function applyInstantly() {
        resetSystems(1);

        for (var index = 0; index < finalRank; index += 1) {
          allocateCandidateInstantly(candidates[index]);
          if (visibleSystemsAreComplete()) {
            break;
          }
        }

        var completedRank = index + 1;
        renderQueue(completedRank + 1);
        svg.dataset.rank = String(completedRank);
        setPhase("complete");
      }

      async function runAnimation() {
        var token = ++runToken;
        var loopStartRank = firstLoop ? firstLoopStartRank : 1;
        firstLoop = false;
        totalPausedTime = 0;
        pauseStarted = 0;
        paused = false;
        pausedByVisibility = false;
        resetSystems(loopStartRank);
        setPhase("running");

        await sleep(500, token);

        for (var index = loopStartRank - 1; index < finalRank; index += 1) {
          if (token !== runToken) {
            return;
          }

          var candidate = candidates[index];
          svg.dataset.rank = candidate.rank;
          var timing = fixedTiming;

          await animateQueueToFork(candidate.rank, timing.approach, token);

          var currentAction = decide("current", candidate);
          var proposedAction = decide("proposed", candidate);

          await Promise.all([
            allocateCopy("current", candidate, currentAction, timing.travel, token),
            allocateCopy("proposed", candidate, proposedAction, timing.travel, token)
          ]);

          emitProgress();
          if (visibleSystemsAreComplete()) {
            break;
          }
          await sleep(timing.gap, token);
        }

        if (token !== runToken) {
          return;
        }

        setPhase("complete");

        if (!playOnce) {
          await sleep(2500, token);
          if (token === runToken) {
            runAnimation();
          }
        }
      }

      function replayAnimation() {
        if (reducedMotion) {
          applyInstantly();
        } else {
          runAnimation();
        }
      }

      function togglePause() {
        if (svg.dataset.phase === "complete") {
          replayAnimation();
          return;
        }

        paused = !paused;
        if (paused) {
          pausedByVisibility = false;
          pauseStarted = performance.now();
          setPhase("paused");
        } else {
          totalPausedTime += performance.now() - pauseStarted;
          pauseStarted = 0;
          pausedByVisibility = false;
          setPhase("running");
        }
      }

      svg.addEventListener("click", togglePause);
      svg.addEventListener("keydown", function (event) {
        if (event.code === "Space") {
          event.preventDefault();
          togglePause();
        }
        if (event.key.toLowerCase() === "r") {
          event.preventDefault();
          replayAnimation();
        }
      });

      pauseControl.addEventListener("click", togglePause);
      replayControl.addEventListener("click", function () {
        replayAnimation();
      });

      window.addEventListener("message", function (event) {
        var message = event.data;
        if (!message) {
          return;
        }

        if (message.type === "reservation-animation-theme") {
          if (message.theme === "dark" || message.theme === "light") {
            applyTheme(message.theme, "message");
          }
          return;
        }

        if (message.type !== "reservation-animation-control") {
          return;
        }

        if (message.action === "toggle") {
          togglePause();
        } else if (message.action === "replay") {
          replayAnimation();
        }
      });

      document.addEventListener("visibilitychange", function () {
        if (document.hidden && !paused && svg.dataset.phase === "running") {
          paused = true;
          pausedByVisibility = true;
          pauseStarted = performance.now();
          setPhase("paused");
        } else if (!document.hidden && pausedByVisibility) {
          totalPausedTime += performance.now() - pauseStarted;
          pauseStarted = 0;
          paused = false;
          pausedByVisibility = false;
          setPhase("running");
        }
      });

      if (reducedMotion) {
        applyInstantly();
      } else {
        runAnimation();
      }
    }());
  </script>
</body>
</html>
